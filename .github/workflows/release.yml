name: release

# 打 tag（v*）或手动触发：构建 Windows + macOS，最后统一发布到 GitHub Release。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # 只出 .app，dmg 自己打 —— 因为必须在打包 dmg **之前**完成签名
      - name: Build .app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} --bundles app

      # Apple 芯片要求至少 ad-hoc 签名，否则打开会报"已损坏"。
      # 没有开发者账号时用 `-`（ad-hoc）：本机能跑，分发给别人仍需去隔离属性。
      - name: Sign (ad-hoc) & verify
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Rill.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -12

      - name: Make dmg
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Rill.app"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "Rill" -srcfolder stage -ov -format UDZO \
            "out/Rill_${VERSION}_${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: out/*.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  publish:
    name: 发布到 Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出待发布文件
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Rill ${{ github.ref_name }}
          body: |
            本地优先的日程 / 求职 / 邮箱助手。数据全部在本机。

            | 平台 | 文件 |
            |---|---|
            | Windows | `Rill_*_x64-setup.exe`（双击安装）/ `.msi` |
            | macOS Apple 芯片（M1–M5） | `Rill_*_aarch64.dmg` |
            | macOS Intel | `Rill_*_x64.dmg` |

            ## macOS 打不开怎么办

            安装包**没有 Apple 开发者签名**，从浏览器/微信下载后系统会提示
            **「Rill 已损坏，无法打开」** —— 这不是文件坏了，是 macOS 的隔离标记。
            把 App 拖进「应用程序」后，任选一种：

            1. 双击附件的 `fix-macos.command`（推荐，会去隔离并自动打开）
            2. 或者打开「终端」执行：
               ```
               xattr -dr com.apple.quarantine /Applications/Rill.app
               ```

            ## Windows

            首次运行点「更多信息 → 仍要运行」。
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            docs/install-windows.txt
            docs/install-macos.txt
            docs/fix-macos.command
